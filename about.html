}

          <nav style={{display:"flex",gap:40,alignItems:"center"}}>
            <Link href="index.html">Work</Link>
            <Link href="about.html" active>About</Link>
            <Link href="resume.html">Resume</Link>
            <Link href="https://www.linkedin.com/in/aisha-momand/" target="_blank" rel="noopener">LinkedIn</Link>

const container = {maxWidth:"var(--container-max)",margin:"0 auto",padding:"0 80px 60px"};

const ARTWORKS = ["gallery-2","gallery-1","gallery-3","gallery-4"];
function ArtworkCarousel({ mobile }) {
  const [i, setI] = React.useState(0);
  const go = (d) => setI((i + d + ARTWORKS.length) % ARTWORKS.length);
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems: mobile ? "center" : "flex-start",gap:16}}>
      <div style={{position:"relative",width:"min(520px,100%)",maxWidth:"100%",aspectRatio:"4/5",borderRadius:"var(--radius-card)",overflow:"hidden",border:"0.56px solid rgba(255,255,255,0.4)",boxShadow:"0 16px 32px rgba(20,30,50,0.12)"}} onMouseEnter={e=>e.currentTarget.querySelectorAll(".carousel-arrow").forEach(b=>b.style.opacity=1)} onMouseLeave={e=>e.currentTarget.querySelectorAll(".carousel-arrow").forEach(b=>b.style.opacity=0)}>
        <image-slot key={ARTWORKS[i]} id={ARTWORKS[i]} shape="rounded" radius="var(--radius-card)" placeholder="Drop artwork" src={`assets/${ARTWORKS[i]}.png`}></image-slot>
        <button aria-label="Previous artwork" onClick={()=>go(-1)} style={{position:"absolute",left:0,top:0,bottom:0,width:64,border:"none",background:"linear-gradient(to right, rgba(20,30,50,0.16), transparent)",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-start",paddingLeft:14,fontSize:22,opacity:0,transition:"opacity 200ms ease"}} className="carousel-arrow">‹</button>
        <button aria-label="Next artwork" onClick={()=>go(1)} style={{position:"absolute",right:0,top:0,bottom:0,width:64,border:"none",background:"linear-gradient(to left, rgba(20,30,50,0.16), transparent)",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:14,fontSize:22,opacity:0,transition:"opacity 200ms ease"}} className="carousel-arrow">›</button>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",justifyContent: mobile ? "center" : "flex-start",width: mobile ? undefined : "min(520px,100%)"}}>
        {ARTWORKS.map((id,idx)=>(
          <button key={id} aria-label={`Go to artwork ${idx+1}`} onClick={()=>setI(idx)} style={{width:idx===i?20:8,height:8,borderRadius:4,border:"none",padding:0,cursor:"pointer",background:idx===i?"var(--text-accent-on-light)":"var(--border-divider)",transition:"width 240ms cubic-bezier(0.16,1,0.3,1),background 240ms ease"}}></button>

function App() {
  const mobile = useIsMobile();
  return (
    <React.Fragment>
      <Navbar />
      <main id="main">
        <div style={{...container,paddingTop:60}}>
          <div className="hero-reveal" style={{display:"flex",gap:60,alignItems:"center",flexWrap:"wrap",marginBottom:60}}>
            <div style={{flex:"1 1 420px",minWidth:0}}>
              <span style={{...labelStyle,display:"block",marginBottom:20}}>About Me</span>
              <h1 style={{font:"var(--text-hero)",fontStyle:"normal",fontWeight:500,fontSize:"clamp(44px,6.5vw,88px)",letterSpacing:"-0.05em",lineHeight:1.05,color:"var(--navy-900)",margin:"0 0 24px"}}>I design order in places most people find overwhelming.</h1>
              <div style={{display:"flex",flexWrap:"wrap",gap:20,marginBottom:32,font:"600 15px/1.4 Inter,sans-serif"}}>
                <a href="mailto:aisha.momand1@gmail.com" style={{textDecoration:"none"}}>aisha.momand1@gmail.com</a>
                <a href="https://www.linkedin.com/in/aisha-momand/" target="_blank" rel="noopener" style={{textDecoration:"none"}}>linkedin.com/in/aisha-momand</a>
              </div>
              <p style={{...bodyStyle,maxWidth:"none",marginBottom:20}}><span style={{float:"left",font:"var(--text-hero)",fontStyle:"italic",fontWeight:500,fontSize:72,lineHeight:0.72,color:"var(--coral-500)",padding:"6px 10px 0 0"}}>H</span>ello, I'm Aisha. I'm a UX/Product Designer based in the GTA, currently on the Digital Solutions team at Stantec, where I design tools that help engineers and infrastructure teams make sense of huge amounts of data.</p>
              <p style={{...bodyStyle,maxWidth:"none"}}>I start with old-fashioned research, then use AI to move faster once I know what I'm building. Either way, the goal is the same: take something genuinely complicated and make it feel obvious.</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:24}}>
                {["Figma","Figma Make","FigJam","Claude Design","Claude Code","Lovable","MAXQDA"].map((t,i)=><Tag key={i}>{t}</Tag>)}
              </div>
            </div>
            <div style={{flex:"0 1 340px",width:"min(340px, 100%)",maxWidth:340,height:410,borderRadius:"var(--radius-card)",overflow:"hidden",border:"0.56px solid rgba(255,255,255,0.4)",boxShadow:"0 16px 32px rgba(20,30,50,0.12)"}}>
              <image-slot id="about-portrait" shape="rounded" radius="var(--radius-card)" placeholder="Drop a portrait" src="assets/aisha-portrait.png"></image-slot>
            </div>
          </div>
          {hr}
          <h2 style={{...h2Style,display:"flex",alignItems:"baseline",gap:16}} className="reveal"><span style={{font:"var(--text-hero)",fontStyle:"italic",fontWeight:500,fontSize:32,lineHeight:1,color:"var(--coral-500)"}}>01</span>What I've Built</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:40,marginBottom:40}} className="reveal">
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Enterprise &amp; Data Systems</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>I've designed tools for pavement management, solar farm planning, mapping software (GIS), and AirLogic, an app that tracks emissions and helped Blue Sky Resources become a Google Cloud partner. I've also designed 3D interfaces used inside Unreal Engine, a game-development tool, for an interactive facility simulation.</p>
            </div>
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Research &amp; Design Systems</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>At Stantec, I've led user research, helped build a shared design system so our products look and feel consistent, and designed tools built on Power Apps and Power BI (Microsoft's business software), including for the US Marines.</p>
            </div>
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Fixing How Teams Work</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>Right now I'm researching how internal rules and approvals actually work across the company, so we can turn that into one clear, guided tool instead of a maze of policies. Alongside that, I'm looking at how teams find and reuse existing resources, so we can bring scattered tools together into one place.</p>
            </div>
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Solar Design Tooling</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>I designed the interface and ran usability testing for a tool that automates layout design for one of Canada's largest solar facilities.</p>
            </div>
          </div>
          {hr}
          <h2 style={{...h2Style,display:"flex",alignItems:"baseline",gap:16}} className="reveal"><span style={{font:"var(--text-hero)",fontStyle:"italic",fontWeight:500,fontSize:32,lineHeight:1,color:"var(--coral-500)"}}>02</span>How I Work</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:40,marginBottom:40}} className="reveal">
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Structure First</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>I start with structure, not screens. Before I design anything, I want to understand where people actually get stuck, through research, interviews, and watching how they really move through a system. Confusion is usually just a sign I haven't found the structure yet.</p>
              <p style={{...cardBodyStyle,maxWidth:"none",marginTop:16}}>In practice, that means using a method from human-computer interaction (HCI): I break a system down into the real tasks people are trying to get done, not the screens or features already on a roadmap, and map what information each task needs and where it tends to break down. That keeps the design honest to how the work actually happens, so what I build fits people's jobs instead of forcing them to adapt to it.</p>
            </div>
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>AI as Acceleration</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>I use AI to move faster, not to think for me. It helps me get through synthesis and iteration more quickly, but I still make the calls, the same way I'd push a design through a few rough drafts before landing on the right one.</p>
            </div>
            <div>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>The Process Matters Too</h3>
              <p style={{...cardBodyStyle,maxWidth:"none"}}>A great-looking screen inside a broken process doesn't actually fix anything. So I try to fix both: the process behind the scenes and what people actually see. That way it holds up once it's out in the real world, not just in a design file.</p>
            </div>
          </div>
          {hr}
          <h2 style={{...h2Style,display:"flex",alignItems:"baseline",gap:16}} className="reveal"><span style={{font:"var(--text-hero)",fontStyle:"italic",fontWeight:500,fontSize:32,lineHeight:1,color:"var(--coral-500)"}}>03</span>Off the Clock</h2>
          <div style={{display:"flex",gap:48,alignItems:"flex-start",flexWrap:"wrap",marginBottom:40}} className="reveal">
            <div style={{flex:"1 1 340px"}}>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Origins in Play</h3>
              <p style={{...cardBodyStyle,maxWidth:"none",marginBottom:24}}>Honestly, this started with a lot of questionable late-night decisions: unpaid art director for my Piczo page, surgeon on Tumblr themes, and way too many hours of "user research" in video games. Turns out that same obsession with tinkering just grew up into a career.</p>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Outside of Work</h3>
              <p style={{...cardBodyStyle,maxWidth:"none",marginBottom:24}}>I care a lot about humane technology and thinking through where AI actually belongs in a design process versus where a person needs to stay in charge. Outside of that, you'll find me weightlifting, playing video games, reading, tinkering on side projects, or falling down a rabbit hole about tech and human behaviour. My cat Ora is usually nearby, pretending she's my project manager (mostly she just wants naps and snacks).</p>
              <h3 style={{...cardTitleStyle,marginBottom:12}}>Places I've Travelled</h3>
              <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                {[["🇨🇦","Canada"],["🇩🇪","Germany"],["🇩🇰","Denmark"],["🇳🇴","Norway"],["🇪🇸","Spain"],["🇮🇹","Italy"]].map(([flag,name])=>(
                  <span key={name} style={{display:"inline-flex",alignItems:"center",gap:8,font:"400 14px/1.3 Inter,sans-serif",color:"var(--text-body)",border:"1px solid var(--border-divider)",borderRadius:"var(--radius-badge, 4px)",padding:"6px 12px"}}><span aria-hidden="true" style={{fontSize:16}}>{flag}</span>{name}</span>
                ))}
              </div>
            </div>
            <div style={{flex:"0 1 320px",width:"min(320px, 100%)",maxWidth:320,height:320,borderRadius:"var(--radius-card)",overflow:"hidden",border:"0.56px solid rgba(255,255,255,0.4)"}}>
              <image-slot id="cat-photo" shape="rounded" radius="18" placeholder="Drop a cat photo" src="assets/cat-photo.png"></image-slot>
            </div>
          </div>
          <span style={{...labelStyle,display:"block",marginBottom:20}} className="reveal">Some Things I've Made for Fun</span>
          <p style={{...cardBodyStyle,maxWidth:"72ch",marginBottom:32}} className="reveal">Design isn't the only thing I make. I also create digital art, mostly for fun and to keep the same experimental muscle warm. Here are a few pieces.</p>
          <div className="reveal"><ArtworkCarousel mobile={mobile} /></div>
          {hr}
          <div className="reveal" style={{display:"flex",gap:40,flexWrap:"wrap"}}>
            <a href="index.html" className="scroll-link" style={{display:"inline-flex",alignItems:"center",gap:12,textDecoration:"none"}}>
              <span aria-hidden="true" className="scroll-line-left"></span>
              <span className="scroll-cue-text">See my work</span>
            </a>
            <a href="resume.html" className="scroll-link" style={{display:"inline-flex",alignItems:"center",gap:12,textDecoration:"none"}}>
              <span className="scroll-cue-text">View my resume</span>
              <span aria-hidden="true" className="scroll-line"></span>
            </a>
          </div>
        </div>
      </main>
      <Footer />
    </React.Fragment>
  );
}

<script>(function(){function initReveal(){const main=document.getElementById("main");if(!main||main.dataset.revealInit)return;main.dataset.revealInit="1";const io=new IntersectionObserver((entries)=>{entries.forEach(e=>{e.target.classList.toggle("in-view",e.isIntersecting);});},{threshold:0.2,rootMargin:"0px 0px -120px 0px"});main.querySelectorAll(".reveal").forEach(el=>io.observe(el));const heroEls=main.querySelectorAll(".hero-reveal");heroEls.forEach(el=>el.classList.add("reveal"));const heroIo=new IntersectionObserver((entries)=>{entries.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add("in-view"),i*100);heroIo.unobserve(e.target);}});},{threshold:0.1});heroEls.forEach(el=>heroIo.observe(el));}setTimeout(initReveal,400);setTimeout(initReveal,1200);})();</script>
