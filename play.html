            <Link href="https://www.linkedin.com/in/aisha-momand/" target="_blank" rel="noopener">LinkedIn</Link>
            <Button variant="primary">Let’s Connect →</Button>
          </nav>
        </div>
      </div>
      <div style={{height:32,marginTop:-1,background:"linear-gradient(to bottom, color-mix(in oklch, var(--surface-page) 55%, transparent), transparent)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",maskImage:"linear-gradient(to bottom, black, transparent)",WebkitMaskImage:"linear-gradient(to bottom, black, transparent)",pointerEvents:"none"}}></div>
    </div>
  );
}

const CHAT_API = "https://ai-sha-api.aisha-mmd96.workers.dev/chat";

const CONTACT_PROMPT = "I want to contact you";
const EMPTY_DRAFT = { subject: "", name: "", email: "", purpose: "", message: "", timing: "" };
const CUSTOM_TOPIC = "Something else";
const SUGGESTIONS = [CONTACT_PROMPT, "Tell me about your work", "What's your design process?"];
const CONTACT_COPY = {
  name: { prompt: "Absolutely—I’ll help you shape a thoughtful note. Let’s start with your first and last name.", placeholder: "Type your first and last name…" },
  email: { prompt: "What email should I include so I can reply?", placeholder: "Type your email…" },
  topic: { prompt: "What are you reaching out about?", placeholder: "Choose one or write your own…", suggestions: ["Project or collaboration", "Role or opportunity", "Portfolio question", CUSTOM_TOPIC] },
  message: { prompt: "Please write a message about what you’d like to discuss. You can edit it later before sending.", placeholder: "Write your message…" },
  timing: { prompt: "And what does the timing look like?", placeholder: "Add timing or choose a suggestion…", suggestions: ["No rush — just exploring", "Within a few weeks", "This is time-sensitive"] }
};

function linkLabel(url) {
  if (url.includes("#work")) return "View selected work";
  if (url.includes("kindex.html")) return "View Kindex case study";
  if (url.includes("about.html")) return "About Aisha";
  if (url.includes("resume.html")) return "View resume";
  if (url.includes("play.html")) return "Open AI-sha";
  return "Open portfolio link";
}

function MessageContent({ text }) {
  return (
    <React.Fragment>
      {text.split(/(https?:\/\/[^\s]+)/g).map((part, i) => {
        if (!part.match(/^https?:\/\//)) return <React.Fragment key={i}>{part}</React.Fragment>;
        const href = part.replace(/[),.!?;:]+$/, "");
        const punctuation = part.slice(href.length);
        const label = linkLabel(href);
        return (
          <React.Fragment key={i}>
            <a className="portfolio-link" href={href} target="_blank" rel="noopener" aria-label={`${label} — opens in a new tab`}>
              <span className="link-mark" aria-hidden="true">↗</span>
              <span className="link-copy">
                <strong>{label}</strong>
                <small>aishammd96.github.io</small>
              </span>
              <span className="link-open">Open ↗</span>
            </a>
            {punctuation}
          </React.Fragment>
        );
      })}
    </React.Fragment>
  );
}

function cleanReply(value) {
  let text = String(value || "").trim();

  if (text.startsWith("{")) {
    try {
      const parsed = JSON.parse(text);
      if (parsed?.reply) return cleanReply(parsed.reply);
    } catch (_) {}
  }

  const metadataStart = text.search(/\s*\{\s*"(?:reply|understood|sources|linkReason|confidence)"\s*:/);
  if (metadataStart > 0) text = text.slice(0, metadataStart);

  const fencedMetadata = text.search(/\s*```(?:json)?\s*\{/i);
  if (fencedMetadata > 0) text = text.slice(0, fencedMetadata);

  return text.trim().replace(/^["']|["']$/g, "");
}

function deriveInsight(question, answer) {
  const lower = question.toLowerCase();
  let understood = "You asked a general question about me and my portfolio.";
  let sources = ["Portfolio overview"];
  let confidence = "medium";

  if (/(work|project|case study|kindex)/.test(lower)) {
    understood = "You asked for an overview of my work and the projects that best represent it.";
    sources = ["Selected work", "Kindex case study"];
    confidence = "high";
  } else if (/(process|approach|design|research)/.test(lower)) {
    understood = "You asked how I approach design, research, and complex product problems.";
    sources = ["Design process", "About Aisha"];
    confidence = "high";
  } else if (/(resume|experience|background|career)/.test(lower)) {
    understood = "You asked about my professional background and experience.";
    sources = ["Resume", "About Aisha"];
    confidence = "high";
  } else if (/(who are you|about|yourself)/.test(lower)) {
    understood = "You asked who I am and how AI-sha relates to my portfolio.";
    sources = ["About Aisha", "Portfolio overview"];
    confidence = "high";
  }

  let linkReason = "No specific portfolio link was needed for this answer.";
  if (answer.includes("#work")) linkReason = "My selected work is the most direct place to explore the projects I mentioned.";
  else if (answer.includes("kindex.html")) linkReason = "The Kindex case study directly supports the project details in this answer.";
  else if (answer.includes("resume.html")) linkReason = "My resume provides the fullest view of my experience.";
  else if (answer.includes("about.html")) linkReason = "My About page adds the most relevant personal and professional context.";

  return { understood, sources, linkReason, confidence };
}

function ThinkingDetails({ elapsed, active = false, insight, retrying = false }) {
  const stage = elapsed < 0.8 ? 0 : elapsed < 1.8 ? 1 : 2;
  if (!active) {
    const confidence = insight?.confidence || "medium";
    return (
      <details className="thinking-panel">
        <summary>{`Why this answer? · ${elapsed.toFixed(1)}s`}</summary>
        <div className="answer-insight">
          <div className="insight-block">
            <span className="insight-label">Understood</span>
            <span className="insight-value">{insight?.understood || "You asked for information related to my portfolio."}</span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Portfolio evidence used</span>
            <span className="source-list">
              {(insight?.sources?.length ? insight.sources : ["Portfolio context"]).map((source, i) => (
                <span className="source-tag" key={i}>{source}</span>
              ))}
            </span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Link choice</span>
            <span className="insight-value">{insight?.linkReason || "No specific portfolio link was needed for this answer."}</span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Confidence</span>
            <span className={"confidence-tag " + confidence}>{confidence}</span>
          </div>
        </div>
        <p className="thinking-note">A concise explanation of the answer—not private chain-of-thought.</p>
      </details>
    );
  }
  return (
    <details className="thinking-panel" open>
      <summary>{`${retrying ? "Retrying connection" : "Working"} · ${elapsed.toFixed(1)}s`}</summary>
      <ol>
        <li className={active && stage === 0 ? "active" : ""}>Reading your question</li>
        <li className={active && stage === 1 ? "active" : ""}>Checking my portfolio context</li>
        <li className={active && stage === 2 ? "active" : ""}>Composing a useful answer</li>
      </ol>
      <p className="thinking-note">Live progress while AI-sha prepares the answer.</p>
    </details>
  );
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const DRAFT_REQUIRED_FIELDS = ["subject", "name", "email", "purpose", "message"];

function isDraftFieldValid(name, value) {
  const trimmed = value.trim();
  if (!DRAFT_REQUIRED_FIELDS.includes(name)) return true;
  if (!trimmed) return false;
  if (name === "email") return EMAIL_RE.test(trimmed);
  return true;
}

function DraftField({ label, name, draft, setDraft, multiline, type = "text", required = true }) {
  const value = draft[name];
  const invalid = required && !isDraftFieldValid(name, value);
  const onChange = event => setDraft(current => ({ ...current, [name]: event.target.value }));
  const className = "draft-field-value" + (multiline ? " draft-field-value-multiline" : "") + (invalid ? " draft-field-invalid" : "");
  return (
    <div className="draft-field">
      <span className="draft-field-label">{label}{required && <span className="draft-field-required" aria-hidden="true">*</span>}</span>
      {multiline
        ? <textarea className={className} value={value} onChange={onChange} aria-invalid={invalid} maxLength="4000" />
        : <input className={className} type={type} value={value} onChange={onChange} aria-invalid={invalid} maxLength="160" />}
      {invalid && <span className="draft-field-error">{name === "email" ? "Enter a valid email address" : "This field can’t be empty"}</span>}
    </div>
  );
}

function ContactDraft({ draft, setDraft, sending, error, onSend, onRestart, onCancel }) {
  const canSend = DRAFT_REQUIRED_FIELDS.every(name => isDraftFieldValid(name, draft[name]));
  return (
    <section className="draft-preview" aria-label="Review your message to Aisha">
      <img className="avatar" src="assets/logo_navy_bluebckg.png" alt="" />
      <div className="draft-preview-content">
        <span className="who-label">AI-sha</span>
        <h2 className="draft-heading">Hmm, here’s the whole message. Make it yours before you send it.</h2>
        <p className="draft-intro">Nothing has been sent. The headings below are fixed—only your answers are editable. Fields marked * are required.</p>
        <form onSubmit={onSend}>
          <div className="draft-editor">
            <DraftField label="Subject" name="subject" draft={draft} setDraft={setDraft} />
            <DraftField label="Name" name="name" draft={draft} setDraft={setDraft} />
            <DraftField label="Email" name="email" type="email" draft={draft} setDraft={setDraft} />
            <DraftField label="Purpose" name="purpose" draft={draft} setDraft={setDraft} />
            <DraftField label="Message" name="message" draft={draft} setDraft={setDraft} multiline />
            <DraftField label="Timing" name="timing" draft={draft} setDraft={setDraft} required={false} />
          </div>
          {error && <p className="contact-error" role="alert">{error}</p>}
          <div className="draft-actions">
            <div className="draft-secondary-actions">
              <button className="contact-secondary" type="button" onClick={onRestart} disabled={sending}>Start over</button>
              <button className="contact-secondary" type="button" onClick={onCancel} disabled={sending}>Cancel contact</button>
            </div>
            <button className="contact-primary" type="submit" disabled={sending || !canSend}>{sending ? "Sending…" : "Send to Aisha →"}</button>
          </div>
          <p className="contact-note">This sends the edited message to aisha.momand1@gmail.com.</p>
        </form>
      </div>
    </section>
  );
}

function ChatBox({ onConversationStart }) {
  const [messages, setMessages] = React.useState([
    {
      role: "bot",
      text: "Hey, I'm AI-sha. Ask me about my work and design process—or I can help you write a thoughtful message to me.",
      suggestions: SUGGESTIONS,
      suggestionType: "initial"
    }
  ]);
  const [input, setInput] = React.useState("");
  const [typing, setTyping] = React.useState(false);
  const [retrying, setRetrying] = React.useState(false);
  const [elapsed, setElapsed] = React.useState(0);
  const [contact, setContact] = React.useState(null);
  const [draft, setDraft] = React.useState(EMPTY_DRAFT);
  const [sending, setSending] = React.useState(false);
  const [contactError, setContactError] = React.useState("");
  const [composerHint, setComposerHint] = React.useState("");
  const scrollRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const startedAt = React.useRef(0);

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, typing, elapsed, contact?.step]);

  React.useEffect(() => {
    if (!typing) return;
    const timer = window.setInterval(() => {
      setElapsed((performance.now() - startedAt.current) / 1000);
    }, 100);
    return () => window.clearInterval(timer);
  }, [typing]);

  function resetComposer() {
    setInput("");
    setComposerHint("");
    if (inputRef.current) inputRef.current.style.height = "46px";
  }

  function startContact() {
    if (typing) return;
    onConversationStart();
    const firstStep = CONTACT_COPY.name;
    setMessages(current => [
      ...current,
      { role: "user", text: CONTACT_PROMPT, contact: true },
      { role: "bot", text: firstStep.prompt, contact: true, contactStep: "name" }
    ]);
    setContact({
      step: "name",
      details: { name: "", email: "", topic: "", message: "", timing: "" }
    });
    setDraft(EMPTY_DRAFT);
    setContactError("");
    resetComposer();
    window.setTimeout(() => inputRef.current?.focus(), 0);
  }

  function answerContact(text) {
    const trimmed = text.trim();
    if (!trimmed || !contact || contact.step === "preview") return;

    if (contact.step === "name" && trimmed.split(/\s+/).filter(Boolean).length < 2) {
      setComposerHint("Please enter both your first and last name.");
      return;
    }

    if (contact.step === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
      setComposerHint("That email looks incomplete—try something like name@example.com.");
      return;
    }

    const details = { ...contact.details, [contact.step]: trimmed };
    const nextStep = {
      name: "email",
      email: "topic",
      topic: "message",
      message: "timing"
    }[contact.step];

    setMessages(current => [...current, { role: "user", text: trimmed, contact: true }]);
    resetComposer();

    if (nextStep) {
      const next = CONTACT_COPY[nextStep];
      const confirmation = {
        name: `Got it — ${trimmed}. ${next.prompt}`,
        email: `Perfect — I’ll use ${trimmed}. ${next.prompt}`,
        topic: `Thanks — ${trimmed}. Please write the message you’d like me to receive. You can edit it before sending.`,
        message: `Got it—you can edit this later in the final draft. ${next.prompt}`
      }[contact.step];
      setContact({ step: nextStep, details });
      window.setTimeout(() => {
        setMessages(current => [...current, {
          role: "bot",
          text: confirmation,
          contact: true,
          contactStep: nextStep,
          suggestions: next.suggestions,
          suggestionType: "contact"
        }]);
        inputRef.current?.focus();
      }, 180);
      return;
    }

    setDraft({
      subject: `${details.topic} — ${details.name}`,
      name: details.name,
      email: details.email,
      purpose: details.topic,
      message: details.message,
      timing: details.timing
    });
    setMessages(current => [...current, {
      role: "bot",
      text: `Perfect — ${trimmed}. Here’s the full message. You can edit everything before sending.`,
      contact: true
    }]);
    setContact({ step: "preview", details });
  }

  async function sendEmail(event) {
    event.preventDefault();
    if (!contact || contact.step !== "preview") return;
    setSending(true);
    setContactError("");
    try {
      const response = await fetch("https://formsubmit.co/ajax/aisha.momand1@gmail.com", {
        method: "POST",
        headers: { "Accept": "application/json" },
        body: new URLSearchParams({
          name: draft.name.trim(),
          email: draft.email.trim(),
          _replyto: draft.email.trim(),
          _subject: draft.subject.trim(),
          subject: draft.subject.trim(),
          message: `Name: ${draft.name.trim()}\n\nPurpose: ${draft.purpose.trim()}\n\nMessage: ${draft.message.trim()}\n\nTiming: ${draft.timing.trim()}`,
          inquiry_type: draft.purpose.trim(),
          timing: draft.timing.trim(),
          _template: "table"
        })
      });
      const result = await response.json();
      if (!response.ok || result.success === "false" || result.success === false) {
        throw new Error(result.message || "The message could not be sent.");
      }
      setMessages(current => [...current, {
        role: "bot",
        text: "It’s on its way to me. Thanks for reaching out—I’ll reply to the email you shared.",
        contact: true,
        suggestions: SUGGESTIONS,
        suggestionType: "initial"
      }]);
      setContact(null);
      setDraft(EMPTY_DRAFT);
    } catch (error) {
      setContactError("That didn’t send just yet. Please try once more, or email me directly at aisha.momand1@gmail.com.");
    } finally {
      setSending(false);
    }
  }

  function restartContact() {
    const firstStep = CONTACT_COPY.name;
    setContact({
      step: "name",
      details: { name: "", email: "", topic: "", message: "", timing: "" }
    });
    setDraft(EMPTY_DRAFT);
    setContactError("");
    setMessages(current => [...current, {
      role: "bot",
      text: `No problem—let’s start fresh. ${firstStep.prompt}`,
      contact: true,
      contactStep: "name"
    }]);
    window.setTimeout(() => inputRef.current?.focus(), 0);
  }

  function cancelContact() {
    if (!contact || sending) return;
    setContact(null);
    setDraft(EMPTY_DRAFT);
    setContactError("");
    resetComposer();
    setMessages(current => [...current, {
      role: "bot",
      text: "No problem—the contact flow is cancelled. You can keep chatting or start again whenever you’re ready.",
      suggestions: SUGGESTIONS,
      suggestionType: "initial"
    }]);
    window.setTimeout(() => inputRef.current?.focus(), 0);
  }

  async function send(text) {
    const trimmed = text.trim();
    if (!trimmed || typing) return;
    onConversationStart();
    if (contact && contact.step !== "preview") {
      answerContact(trimmed);
      return;
    }
    const history = messages.filter(m => !m.contact).slice(-6).map(m => ({
      role: m.role === "bot" ? "assistant" : "user",
      content: m.text
    }));
    setMessages(m => [...m, { role: "user", text: trimmed }]);
    resetComposer();
    startedAt.current = performance.now();
    setElapsed(0);
    setRetrying(false);
    setTyping(true);
    try {
      let data;
      let lastError;
      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          const response = await fetch(CHAT_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: trimmed, history })
          });
          const responseData = await response.json();
          if (!response.ok) throw new Error(responseData.error || "Request failed");
          data = responseData;
          break;
        } catch (error) {
          lastError = error;
          if (attempt === 0) {
            setRetrying(true);
            await new Promise(resolve => window.setTimeout(resolve, 650));
          }
        }
      }
      if (!data) throw lastError || new Error("Request failed");
      const responseTime = (performance.now() - startedAt.current) / 1000;
      const reply = cleanReply(data.reply);
      const genericInsight = !data.insight || data.insight.sources?.[0] === "Portfolio context";
      const insight = genericInsight ? deriveInsight(trimmed, reply) : {
        ...data.insight,
        linkReason: /https?:\/\//.test(reply)
          ? data.insight.linkReason
          : "No specific portfolio link was needed for this answer."
      };
      setMessages(m => [...m, { role: "bot", text: reply, elapsed: responseTime, insight, suggestions: [CONTACT_PROMPT], suggestionType: "initial" }]);
    } catch (error) {
      const responseTime = (performance.now() - startedAt.current) / 1000;
      setMessages(m => [...m, {
        role: "bot",
        text: "I'm taking a quick pause right now. Please try that again in a moment.",
        elapsed: responseTime
      }]);
    } finally {
      setTyping(false);
      setRetrying(false);
    }
  }

  function onSubmit(e) {
    e.preventDefault();
    send(input);
  }

  function onInputChange(e) {
    setInput(e.target.value);
    e.target.style.height = "46px";
    e.target.style.height = Math.min(e.target.scrollHeight, 148) + "px";
    e.target.style.overflowY = e.target.scrollHeight > 148 ? "auto" : "hidden";
  }

  function onInputKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(input);
    }
  }

  function useSuggestion(suggestion) {
    if (contact && contact.step !== "preview") {
      if (contact.step === "topic" && suggestion === CUSTOM_TOPIC) {
        setContact(current => ({ ...current, customTopic: true }));
        setInput("");
        setComposerHint("Tell me what you’re reaching out about in your own words.");
        window.setTimeout(() => inputRef.current?.focus(), 0);
        return;
      }
      answerContact(suggestion);
    } else if (suggestion === CONTACT_PROMPT) {
      startContact();
    } else {
      send(suggestion);
    }
  }

  const placeholder = contact && contact.step !== "preview"
    ? (contact.step === "topic" && contact.customTopic
      ? "Describe what you’re reaching out about…"
      : CONTACT_COPY[contact.step].placeholder)
    : "Message AI-sha…";

  return (
    <div className="play-hero">
      <div className="transcript" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={"msg-row " + (m.role === "user" ? "user" : "bot")}>
            {m.role === "bot" && <img className="avatar" src="assets/logo_navy_bluebckg.png" alt="" />}
            <div>
              <span className="who-label">{m.role === "user" ? "You" : "AI-sha"}</span>
              {m.role === "bot" && m.elapsed != null && <ThinkingDetails elapsed={m.elapsed} insight={m.insight} />}
              <div className={"msg-text " + (m.role === "user" ? "user" : "bot")}><MessageContent text={m.text} /></div>
              {m.suggestions && (
                (m.suggestionType === "initial" && !contact && i === messages.length - 1) ||
                (m.suggestionType === "contact" && m.contactStep === contact?.step && i === messages.length - 1)
              ) && (
                <div className="suggestion-row" aria-label="Suggested replies">
                  {m.suggestions.map((suggestion, suggestionIndex) => (
                    <button key={suggestionIndex} className="chip-btn" type="button" disabled={typing} onClick={() => useSuggestion(suggestion)}>{suggestion}</button>
                  ))}
                </div>
              )}
            </div>
          </div>
        ))}
        {typing && (
          <div className="msg-row bot">
            <img className="avatar" src="assets/logo_navy_bluebckg.png" alt="" />
            <div>
              <span className="who-label">AI-sha</span>
              <ThinkingDetails elapsed={elapsed} active retrying={retrying} />
              <div className="msg-text bot">
                <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
              </div>
            </div>
          </div>
        )}
        {contact?.step === "preview" && (
          <ContactDraft
            draft={draft}
            setDraft={setDraft}
            sending={sending}
            error={contactError}
            onSend={sendEmail}
            onRestart={restartContact}
            onCancel={cancelContact}
          />
        )}
      </div>
      {contact?.step !== "preview" && (
        <div className="chat-dock">
          {contact && (
            <div className="contact-flow-bar">
              <span className="contact-flow-label">Writing a message to Aisha</span>
              <button className="contact-cancel" type="button" onClick={cancelContact}>Cancel</button>
            </div>
          )}
          <form className="chat-form" onSubmit={onSubmit}>
            <textarea
              ref={inputRef}
              className="chat-input"
              rows="1"
              maxLength="1200"
              placeholder={placeholder}
              value={input}
              onChange={onInputChange}
              onKeyDown={onInputKeyDown}
              disabled={typing}
              aria-label="Message"
            ></textarea>
            <button className="send-fab" type="submit" disabled={typing} aria-label="Send">&#8594;</button>
          </form>
          {composerHint && <p className="composer-hint" role="alert">{composerHint}</p>}
        </div>
      )}
    </div>
  );
}

function App() {
  const mobile = useIsMobile();
  const [conversationStarted, setConversationStarted] = React.useState(false);
  return (
    <React.Fragment>
      <div className="site-shell">
        <Navbar mobile={mobile} />
        <main id="main" className="play-main">
          <div className={"play-layout" + (conversationStarted ? " is-chatting" : "")}>
            <h1 className="talk-heading">Connect with <span className="accent-hl" style={{color:"var(--coral-500)",fontStyle:"italic"}}>AI&#8209;sha</span></h1>
            <ChatBox onConversationStart={() => setConversationStarted(true)} />
          </div>
        </main>
      </div>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
