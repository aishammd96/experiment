  const [mobile, setMobile] = React.useState(window.innerWidth < 1000);

function linkLabel(url) {
  if (url.includes("#work")) return "View selected work";
  if (url.includes("kindex.html")) return "View Kindex case study";
  if (url.includes("about.html")) return "About Aisha";
  if (url.includes("resume.html")) return "View resume";
  if (url.includes("play.html")) return "Open AI-sha";
  return "Open portfolio link";
}

function MessageContent({ text }) {
  return (
    <React.Fragment>
      {text.split(/(https?:\/\/[^\s]+)/g).map((part, i) => {
        if (!part.match(/^https?:\/\//)) return <React.Fragment key={i}>{part}</React.Fragment>;
        const href = part.replace(/[),.!?;:]+$/, "");
        const punctuation = part.slice(href.length);
        const label = linkLabel(href);
        return (
          <React.Fragment key={i}>
            <a className="portfolio-link" href={href} target="_blank" rel="noopener" aria-label={`${label} — opens in a new tab`}>
              <span className="link-mark" aria-hidden="true">↗</span>
              <span className="link-copy">
                <strong>{label}</strong>
                <small>aishammd96.github.io</small>
              </span>
              <span className="link-open">Open ↗</span>
            </a>
            {punctuation}
          </React.Fragment>
        );
      })}
    </React.Fragment>
  );
}

function cleanReply(value) {
  let text = String(value || "").trim();

  if (text.startsWith("{")) {
    try {
      const parsed = JSON.parse(text);
      if (parsed?.reply) return cleanReply(parsed.reply);
    } catch (_) {}
  }

  const metadataStart = text.search(/\s*\{\s*"(?:reply|understood|sources|linkReason|confidence)"\s*:/);
  if (metadataStart > 0) text = text.slice(0, metadataStart);

  const fencedMetadata = text.search(/\s*```(?:json)?\s*\{/i);
  if (fencedMetadata > 0) text = text.slice(0, fencedMetadata);

  return text.trim().replace(/^["']|["']$/g, "");
}

function deriveInsight(question, answer) {
  const lower = question.toLowerCase();
  let understood = "You asked a general question about me and my portfolio.";
  let sources = ["Portfolio overview"];
  let confidence = "medium";

  if (/(work|project|case study|kindex)/.test(lower)) {
    understood = "You asked for an overview of my work and the projects that best represent it.";
    sources = ["Selected work", "Kindex case study"];
    confidence = "high";
  } else if (/(process|approach|design|research)/.test(lower)) {
    understood = "You asked how I approach design, research, and complex product problems.";
    sources = ["Design process", "About Aisha"];
    confidence = "high";
  } else if (/(resume|experience|background|career)/.test(lower)) {
    understood = "You asked about my professional background and experience.";
    sources = ["Resume", "About Aisha"];
    confidence = "high";
  } else if (/(who are you|about|yourself)/.test(lower)) {
    understood = "You asked who I am and how AI-sha relates to my portfolio.";
    sources = ["About Aisha", "Portfolio overview"];
    confidence = "high";
  }

  let linkReason = "No specific portfolio link was needed for this answer.";
  if (answer.includes("#work")) linkReason = "My selected work is the most direct place to explore the projects I mentioned.";
  else if (answer.includes("kindex.html")) linkReason = "The Kindex case study directly supports the project details in this answer.";
  else if (answer.includes("resume.html")) linkReason = "My resume provides the fullest view of my experience.";
  else if (answer.includes("about.html")) linkReason = "My About page adds the most relevant personal and professional context.";

  return { understood, sources, linkReason, confidence };
}

function ThinkingDetails({ elapsed, active = false, insight, retrying = false }) {
  const stage = elapsed < 0.8 ? 0 : elapsed < 1.8 ? 1 : 2;
  if (!active) {
    const confidence = insight?.confidence || "medium";
    return (
      <details className="thinking-panel">
        <summary>{`Why this answer? · ${elapsed.toFixed(1)}s`}</summary>
        <div className="answer-insight">
          <div className="insight-block">
            <span className="insight-label">Understood</span>
            <span className="insight-value">{insight?.understood || "You asked for information related to my portfolio."}</span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Portfolio evidence used</span>
            <span className="source-list">
              {(insight?.sources?.length ? insight.sources : ["Portfolio context"]).map((source, i) => (
                <span className="source-tag" key={i}>{source}</span>
              ))}
            </span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Link choice</span>
            <span className="insight-value">{insight?.linkReason || "No specific portfolio link was needed for this answer."}</span>
          </div>
          <div className="insight-block">
            <span className="insight-label">Confidence</span>
            <span className={"confidence-tag " + confidence}>{confidence}</span>
          </div>
        </div>
        <p className="thinking-note">A concise explanation of the answer—not private chain-of-thought.</p>
      </details>
    );
  }
  return (
    <details className="thinking-panel" open>
      <summary>{`${retrying ? "Retrying connection" : "Working"} · ${elapsed.toFixed(1)}s`}</summary>
      <ol>
        <li className={active && stage === 0 ? "active" : ""}>Reading your question</li>
        <li className={active && stage === 1 ? "active" : ""}>Checking my portfolio context</li>
        <li className={active && stage === 2 ? "active" : ""}>Composing a useful answer</li>
      </ol>
      <p className="thinking-note">Live progress while AI-sha prepares the answer.</p>
    </details>
  );
}

function ContactFlow({ onClose }) {

  const [details, setDetails] = React.useState({
    name: "",
    email: "",
    company: "",
    topic: "Project or collaboration",
    message: "",
    timing: "",
    honey: ""
  });
  const [draft, setDraft] = React.useState({ subject: "", body: "" });

  function updateDetail(event) {
    const { name, value } = event.target;
    setDetails(current => ({ ...current, [name]: value }));
  }

  function createDraft(event) {
    event.preventDefault();
    const companyLine = details.company.trim() ? ` from ${details.company.trim()}` : "";

    setDraft({
      subject: `${details.topic} — ${details.name.trim()}`,
      body: `Hi Aisha,\n\nI’m ${details.name.trim()}${companyLine}. I’m reaching out about ${details.topic.toLowerCase()}.\n\n${details.message.trim()}${timingLine}\n\nWould you be open to a conversation? I’d be happy to share more context and find a time that works for you.\n\nBest,\n${details.name.trim()}`
    });
    setError("");
    setStep("draft");
  }

  async function sendEmail(event) {
    event.preventDefault();
    if (details.honey) {
      setStep("sent");
      return;
    }
    setSending(true);
    setError("");
    try {
      const response = await fetch("https://formsubmit.co/ajax/aisha.momand1@gmail.com", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          name: details.name.trim(),
          email: details.email.trim(),
          _replyto: details.email.trim(),
          _subject: draft.subject.trim(),
          subject: draft.subject.trim(),
          message: draft.body.trim(),
          company: details.company.trim() || "Not provided",
          inquiry_type: details.topic,
          timing: details.timing.trim() || "Not provided",

      const result = await response.json();
      if (!response.ok || result.success === "false" || result.success === false) {
        throw new Error(result.message || "The message could not be sent.");
      }
      setStep("sent");
    } catch (sendError) {
      setError("That didn’t send just yet. Please try once more, or email me directly at aisha.momand1@gmail.com.");
    } finally {
      setSending(false);
    }
  }

  return (
    <section className="contact-flow" aria-label="Contact Aisha">
      <div className="contact-flow-head">
        <div>
          <p className="contact-kicker">Contact, with a little help from AI-sha</p>
          <h2 className="contact-title">{step === "sent" ? "Message sent." : step === "draft" ? "Here’s a polished first draft." : "Let’s make the first email easier."}</h2>
          {step === "questions" && <p className="contact-intro">Share the essentials. I’ll shape them into a clear email you can review before anything is sent.</p>}
          {step === "draft" && <p className="contact-intro">Edit anything you’d like—this should still sound like you.</p>}
        </div>
        <button className="contact-close" type="button" onClick={onClose} aria-label="Close contact form">×</button>
      </div>

      {step === "questions" && (
        <form onSubmit={createDraft}>
          <div className="contact-grid">
            <label className="contact-field">
              <span className="contact-label">Your name</span>
              <input name="name" value={details.name} onChange={updateDetail} required maxLength="80" autoComplete="name" />
            </label>
            <label className="contact-field">
              <span className="contact-label">Your email</span>
              <input name="email" type="email" value={details.email} onChange={updateDetail} required maxLength="120" autoComplete="email" />
            </label>
            <label className="contact-field">
              <span className="contact-label">Company or team <small>(optional)</small></span>

            <label className="contact-field">
              <span className="contact-label">What’s this about?</span>

                <option>Role or opportunity</option>

      {step === "sent" && (
        <div className="contact-success" role="status">
          <strong>It’s on its way to Aisha.</strong>
          <p>Your email address is included so she can reply directly. Thanks for reaching out.</p>
        </div>
      )}
    </section>
  );
}

function ChatBox() {
  const [messages, setMessages] = React.useState([
    { role: "bot", text: "Hey, I'm AI-sha. Ask me about my work, how I approach design, or what I'm like to collaborate with." }
  ]);
  const [input, setInput] = React.useState("");
  const [typing, setTyping] = React.useState(false);
  const [retrying, setRetrying] = React.useState(false);
  const [elapsed, setElapsed] = React.useState(0);
  const [contactOpen, setContactOpen] = React.useState(false);
  const scrollRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const startedAt = React.useRef(0);

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, typing, elapsed, contactOpen]);

  React.useEffect(() => {
    if (!typing) return;
    const timer = window.setInterval(() => {
      setElapsed((performance.now() - startedAt.current) / 1000);
    }, 100);
    return () => window.clearInterval(timer);
  }, [typing]);

  React.useEffect(() => {
    const openContact = () => setContactOpen(true);
    window.addEventListener("open-ai-sha-contact", openContact);
    return () => window.removeEventListener("open-ai-sha-contact", openContact);
  }, []);

  async function send(text) {
    const trimmed = text.trim();
    if (!trimmed || typing) return;
    const history = messages.slice(-6).map(m => ({
      role: m.role === "bot" ? "assistant" : "user",
      content: m.text
    }));
    setMessages(m => [...m, { role: "user", text: trimmed }]);
    setInput("");
    if (inputRef.current) inputRef.current.style.height = "46px";
    startedAt.current = performance.now();
    setElapsed(0);
    setRetrying(false);
    setTyping(true);
    try {
      let data;
      let lastError;
      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          const response = await fetch(CHAT_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: trimmed, history })
          });
          const responseData = await response.json();
          if (!response.ok) throw new Error(responseData.error || "Request failed");
          data = responseData;
          break;
        } catch (error) {
          lastError = error;
          if (attempt === 0) {
            setRetrying(true);
            await new Promise(resolve => window.setTimeout(resolve, 650));
          }
        }
      }
      if (!data) throw lastError || new Error("Request failed");
      const responseTime = (performance.now() - startedAt.current) / 1000;
      const reply = cleanReply(data.reply);
      const genericInsight = !data.insight || data.insight.sources?.[0] === "Portfolio context";
      const insight = genericInsight ? deriveInsight(trimmed, reply) : {
        ...data.insight,
        linkReason: /https?:\/\//.test(reply)
          ? data.insight.linkReason
          : "No specific portfolio link was needed for this answer."
      };
      setMessages(m => [...m, { role: "bot", text: reply, elapsed: responseTime, insight }]);
    } catch (error) {
      const responseTime = (performance.now() - startedAt.current) / 1000;
      setMessages(m => [...m, {
        role: "bot",
        text: "I'm taking a quick pause right now. Please try that again in a moment.",
        elapsed: responseTime
      }]);
    } finally {
      setTyping(false);
      setRetrying(false);
    }
  }

  function onSubmit(e) {
    e.preventDefault();
    send(input);
  }

  function onInputChange(e) {
    setInput(e.target.value);
    e.target.style.height = "46px";
    e.target.style.height = Math.min(e.target.scrollHeight, 148) + "px";
    e.target.style.overflowY = e.target.scrollHeight > 148 ? "auto" : "hidden";
  }

  function onInputKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(input);
    }
  }

  return (
    <div className="play-hero">
      <p className="status-line"><span className="status-dot"></span>Built from my work, resume, and case studies</p>
      <div className="transcript" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={"msg-row " + (m.role === "user" ? "user" : "bot")}>
            {m.role === "bot" && <img className="avatar" src="assets/logo_navy_bluebckg.png" alt="" />}
            <div>
              <span className="who-label">{m.role === "user" ? "You" : "AI-sha"}</span>
              {m.role === "bot" && m.elapsed != null && <ThinkingDetails elapsed={m.elapsed} insight={m.insight} />}
              <div className={"msg-text " + (m.role === "user" ? "user" : "bot")}><MessageContent text={m.text} /></div>
            </div>
          </div>
        ))}
        {typing && (
          <div className="msg-row bot">
            <img className="avatar" src="assets/logo_navy_bluebckg.png" alt="" />
            <div>
              <span className="who-label">AI-sha</span>
              <ThinkingDetails elapsed={elapsed} active retrying={retrying} />
              <div className="msg-text bot">
                <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
              </div>
            </div>
          </div>
        )}
        {contactOpen && <ContactFlow onClose={() => setContactOpen(false)} />}
      </div>
      <div className="chip-row">
        {SUGGESTIONS.map((s, i) => (
          <button key={i} className="chip-btn" type="button" disabled={typing} onClick={() => s === CONTACT_PROMPT ? setContactOpen(true) : send(s)}>{s}</button>
        ))}
      </div>
      <form className="chat-form" onSubmit={onSubmit}>
        <textarea
          ref={inputRef}
          className="chat-input"
          rows="1"
          maxLength="800"
          placeholder="Ask AI-sha something..."
          value={input}
          onChange={onInputChange}
          onKeyDown={onInputKeyDown}
          disabled={typing}
          aria-label="Message"
        ></textarea>
        <button className="send-fab" type="submit" disabled={typing} aria-label="Send">&#8594;</button>
      </form>
    </div>
  );
}
