function useIsMobile() {
  const [mobile, setMobile] = React.useState(window.innerWidth < 1000);
  React.useEffect(() => {
    const mq = window.matchMedia("(max-width: 1000px)");
    const onChange = () => setMobile(mq.matches);
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, []);
  return mobile;
}

function useReveal() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Hero({ mobile }) {

  const [caretOn, setCaretOn] = React.useState(true);
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    const words = ["Hello, I'm Aisha.", "I cut the complexity.", "build clarity."];
    const splitAt = [11, 10, 0];
    let cancelled = false;
    const sleep = (ms) => new Promise(r=>setTimeout(r,ms));

      await sleep(600);
      for (let w=0; w<words.length; w++) {
        setWordIdx(w);
        const word = words[w];
        const startLen = w===2 ? 0 : 0;
        for (let i=1; i<=word.length; i++) {
          if (cancelled) return;
          setText(word.slice(0,i));
          await sleep(65);

          for (let i=word.length; i>=backTo; i--) {

            setText(word.slice(0,i));
            await sleep(32);
          }
          await sleep(250);
        }

  const onLeave = () => setTilt({ x: 0, y: 0 });
  if (mobile) {
    return (

      </div>
      </React.Fragment>
    );
  }
  return (
    <React.Fragment>
    <div style={{display:"flex",gap:64,alignItems:"center",flexWrap:"wrap",maxWidth:"var(--container-max)",margin:"0 auto",padding:"64px 80px 0"}}>
      <div className="hero-anim" style={{display:"flex",flexDirection:"column",gap:40,flex:"1 1 520px",minWidth:0}}>
        <span style={{font:"700 12px/1.3 Inter,sans-serif",letterSpacing:2,textTransform:"uppercase",color:"var(--text-accent-on-light)"}}>Product/UX Designer for Complex Systems</span>
        <h1 style={{font:"var(--text-hero)",fontSize:"clamp(40px, 6vw, 132px)",letterSpacing:"-0.055em",margin:0,lineHeight:1.3,whiteSpace:"nowrap"}}>{wordIdx===0 ? <React.Fragment><span style={{color:"var(--navy-900)",fontStyle:"normal",fontWeight:500}}>{text.slice(0,Math.min(text.length,11))}</span><span style={{color:"var(--coral-500)",fontStyle:"italic",fontWeight:500}}>{text.slice(11)}</span></React.Fragment> : wordIdx===1 ? <React.Fragment><span style={{color:"var(--navy-900)",fontStyle:"normal",fontWeight:500}}>{text.slice(0,Math.min(text.length,10))}</span><span style={{color:"var(--coral-500)",fontStyle:"italic",fontWeight:500}}>{text.slice(10)}</span></React.Fragment> : <React.Fragment><span style={{color:"var(--navy-900)",fontStyle:"normal",fontWeight:500}}>{"I "+text.slice(0,Math.min(text.length,6))}</span><span style={{color:"var(--coral-500)",fontStyle:"italic",fontWeight:500}}>{text.slice(6)}</span></React.Fragment>}{!done && <span style={{opacity:caretOn?1:0,color:"var(--navy-900)"}}>|</span>}</h1>
        <div style={{display:"flex",flexDirection:"column",gap:40}}>
          <h2 style={{font:"var(--text-display-md)",margin:0}}><span style={{color:"var(--text-body)"}}>I work where people, data, and complexity meet</span>—<span style={{color:"var(--text-body)"}}>designing systems people can rely on.</span></h2>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:16}}>
          {["product/ux design","enterprise + data","systems design","research"].map((t,i)=><Tag key={i}>{t}</Tag>)}
        </div>
      </div>
      <img ref={heroRef} src={heroImg} alt="Illustration of a woman cutting through tangled complexity with scissors" className="hero-illustration" style={{width:"clamp(260px, 28vw, 420px)",flexShrink:0,margin:"0 auto"}} />
    </div>
    <div className="scroll-link-wrap" style={{maxWidth:"var(--container-max)",margin:"0 auto",padding:"0 80px"}}>
    <a href="#work" aria-label="Scroll to selected works" className="scroll-link" style={{display:"inline-flex",alignItems:"center",gap:12,padding:"48px 0 0",textDecoration:"none",width:"fit-content"}}>
      <span className="scroll-cue-text" style={{whiteSpace:"nowrap"}}>See the work</span>
      <span className="scroll-line"></span>
    </a>
    </div>
    </React.Fragment>
  );
}

function WorkCard({ p, i, mobile }) {
  const ref = useReveal();
  return (
    <a ref={ref} href={p.href || "#"} className="work-card reveal" style={{display:"flex",flexDirection:"column",gap: mobile ? 12 : 20,textDecoration:"none",transitionDelay:`${i*80}ms`}}>
      <div className="work-media" style={{aspectRatio:"2560/1558",borderRadius:"var(--radius-card)",background: p.href==="kindex.html" ? `url(${(window.__resources&&window.__resources.kindex)||"assets/kindex-preview.png"}) center/cover` : "var(--surface-media-placeholder)",border:"0.56px solid rgba(255,255,255,0.4)"}}></div>
      <span className="work-title" style={{font:"var(--text-display-sm)",fontSize: mobile ? 20 : 22,transition:"color var(--dur-fast,240ms) var(--ease-out,ease-out)"}}>{p.title}</span>
      <div className="tag-pop" style={{display:"flex",gap: mobile ? 12 : 24,flexWrap:"wrap"}}>{p.tags.map((t,j)=><Tag key={j}>{t}</Tag>)}</div>
    </a>
  );
}

function Works({ mobile }) {
  return (
    <div style={{maxWidth:"var(--container-max)",margin:"0 auto",padding: mobile ? "48px 20px 64px" : "96px 80px 80px"}}>
      <div style={{borderTop:"1px solid var(--border-divider)",marginBottom: mobile ? 32 : 72}}></div>
      <h2 id="work" style={{font:"var(--text-display-md)",fontSize: mobile ? 28 : 44,letterSpacing: mobile ? undefined : "-0.02em",color:"var(--navy-900)",margin: mobile ? "0 0 24px" : "0 0 60px",display:"flex",alignItems:"baseline",gap:16}}><span style={{font:"var(--text-hero)",fontStyle:"italic",fontWeight:500,fontSize: mobile ? 22 : 32,lineHeight:1,color:"var(--coral-500)"}}>01</span>Selected Works</h2>
      <div style={{display: mobile ? "flex" : "grid",flexDirection: mobile ? "column" : undefined,gridTemplateColumns: mobile ? undefined : "1fr 1fr",gap: mobile ? 48 : 60}}>
        {PROJECTS.map((p,i)=><WorkCard key={i} p={p} i={i} mobile={mobile} />)}
      </div>
    </div>
  );
}

function App() {
  const mobile = useIsMobile();
  return (
    <React.Fragment>
      <Navbar mobile={mobile} />
      <main id="main">
        <Hero mobile={mobile} />
        <Works mobile={mobile} />
      </main>
      <Footer />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</body>
