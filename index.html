function useIsMobile() {
  const [mobile, setMobile] = React.useState(window.innerWidth < 1000);
  React.useEffect(() => {
    const mq = window.matchMedia("(max-width: 1000px)");
    const onChange = () => setMobile(mq.matches);
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, []);
  return mobile;
}

function useReveal() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Hero({ mobile }) {
  const heroImg = (window.__resources&&window.__resources.hero)||"assets/hero-illustration.png";
  const heroRef = React.useRef(null);
  const [text, setText] = React.useState("");
  const [wordIdx, setWordIdx] = React.useState(0);
  const [caretOn, setCaretOn] = React.useState(true);
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    const words = ["Hello, I'm Aisha.", "I cut the complexity.", "build clarity."];
    const splitAt = [11, 10, 0];
    let cancelled = false;
    const sleep = (ms) => new Promise(r=>setTimeout(r,ms));
    async function run() {
      await sleep(600);
      for (let w=0; w<words.length; w++) {
        setWordIdx(w);
        const word = words[w];
        const startLen = w===2 ? 0 : 0;
        for (let i=1; i<=word.length; i++) {
          if (cancelled) return;
          setText(word.slice(0,i));
          await sleep(65);
        }
        if (w===words.length-1) setDone(true);
        await sleep(w===words.length-1 ? 99999 : 1300);
        if (w<words.length-1) {
          const backTo = w===1 ? 2 : 0;
          for (let i=word.length; i>=backTo; i--) {
            if (cancelled) return;
            setText(word.slice(0,i));
            await sleep(32);
          }
          await sleep(250);
        }
      }
    }
    run();
    const blink = setInterval(()=>setCaretOn(c=>!c), 500);
    return () => { cancelled = true; clearInterval(blink); };
