function TableOfContents() {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const [hoverIdx, setHoverIdx] = React.useState(null);
  const [progress, setProgress] = React.useState(0);
  const [segFill, setSegFill] = React.useState(0);
  const [open, setOpen] = React.useState(false);
  React.useEffect(()=>{const onDoc=e=>{if(!e.target.closest(".toc-bar-inner"))setOpen(false);};document.addEventListener("click",onDoc);return()=>document.removeEventListener("click",onDoc);},[]);
  React.useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      const scrollable = doc.scrollHeight - doc.clientHeight;
      setProgress(scrollable > 0 ? Math.min(1, window.scrollY / scrollable) : 0);
      const positions = SECTIONS.map(([,,id]) => {
        const el = document.getElementById(id);
        return el ? el.getBoundingClientRect().top : Infinity;
      });
      let idx = 0;
      positions.forEach((top, i) => { if (top - 220 <= 0) idx = i; });
      setActiveIdx(idx);
      const start = positions[idx];
      const next = positions[idx+1];
      if (next !== undefined && isFinite(next)) {
        const span = next - start;
        setSegFill(span > 0 ? Math.min(1, Math.max(0, (220 - start) / span)) : 1);
      } else { setSegFill(1); }
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <div className="toc-bar">
      <div className="toc-bar-inner">
        <button className="toc-bar-trigger" aria-expanded={open} aria-haspopup="true" onClick={()=>setOpen(o=>!o)}>
          <span className="toc-bar-num num-badge-sm">{SECTIONS[activeIdx][0]}</span>
          <span className="toc-bar-label">{SECTIONS[activeIdx][1]}</span>
          <span className="toc-bar-chev" aria-hidden="true"></span>
        </button>
        <span className="toc-bar-count">{activeIdx+1}/{SECTIONS.length}</span>
        {open && (
          <div className="toc-menu" role="menu">
            {SECTIONS.map(([num,label,id],i)=>(
              <a key={id} href={`#${id}`} role="menuitem" className={`toc-menu-item${i===activeIdx?" active":""}`} onClick={()=>setOpen(false)}>
                <span className="toc-menu-num num-badge-sm">{num}</span><span>{label}</span>
              </a>
            ))}
          </div>
        )}
      </div>
      <div className="toc-bar-track" role="progressbar" aria-label="Reading progress" aria-valuenow={Math.round(progress*100)} aria-valuemin={0} aria-valuemax={100}><div className="toc-bar-fill" style={{width:`${progress*100}%`}}></div></div>
    </div>
  );
}

heroEls.forEach(el=>heroIo.observe(el));const io=new IntersectionObserver((entries)=>{entries.forEach(e=>{e.target.classList.toggle("in-view",e.isIntersecting);});},{threshold:0.2,rootMargin:"0px 0px -120px 0px"});main.querySelectorAll(".reveal").forEach(el=>io.observe(el));}setTimeout(initReveal,400);setTimeout(initReveal,1200);})();</script>
